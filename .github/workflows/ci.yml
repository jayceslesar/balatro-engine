name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install PDM
      run: |
        pip install pdm

    - name: Install dependencies
      run: |
        pdm sync -G:all

    - name: Run tests
      run: |
        pdm run pytest

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install PDM
      run: |
        pip install pdm

    - name: Install dependencies
      run: |
        pdm sync -G:all

    - name: Run linting
      run: |
        pdm run lint
